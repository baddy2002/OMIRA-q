name: "DMPNNNet"
family: "neural"
params:
  hidden_dim: 256
  num_layers: 3
  heads: 4
  dropout: 0.1
  num_node_features: 12
  num_edge_features: 7  
  num_tasks: 6
  use_morgan_fingerprint: False
  fingerprint_n_bits: 4
training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.00001
  patience: 20
  batch_size: 64